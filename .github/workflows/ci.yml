name: Test AdamantiumFiles

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test native filesystem operations
        run: cargo test --locked
      - name: Build WASI package
        run: cargo build --locked --release --target wasm32-wasip1 --bin adamantium-files
      - name: Validate and execute WASM filesystem tests
        run: node tests/wasi.mjs
      - name: Prepare package asset
        if: matrix.os == 'ubuntu-latest'
        run: cp target/wasm32-wasip1/release/adamantium-files.wasm adamantium_packet.wasm
      - name: Upload tested package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: adamantium-files-wasi
          path: adamantium_packet.wasm
          if-no-files-found: error

  release:
    name: Publish Adamantium package
    if: startsWith(github.ref, 'refs/tags/adamantium_packet_')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify tag matches Cargo package version
        shell: bash
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          expected="adamantium_packet_${version//./_}"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Tag '$GITHUB_REF_NAME' does not match Cargo version '$version'. Expected '$expected'." >&2
            exit 1
          fi
      - name: Download tested package
        uses: actions/download-artifact@v5
        with:
          name: adamantium-files-wasi
      - name: Validate release asset
        run: |
          test -f adamantium_packet.wasm
          test "$(od -An -tx1 -N8 adamantium_packet.wasm | tr -d ' \n')" = "0061736d01000000"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" adamantium_packet.wasm --generate-notes --verify-tag
